name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: docker build --file tests/docker/Dockerfile --tag codebridge-adversarial:ci .
      - run: npm run test:sandbox-docker
        env:
          CODEBRIDGE_TEST_IMAGE: codebridge-adversarial:ci
      - run: python3 -B -m unittest discover -s sandbox -p 'test_*.py'
      - run: node scripts/inspector-smoke.mjs
      - run: npm run test:coverage
      - run: npm run check:security-coverage
      - run: npm run validate:plugin
